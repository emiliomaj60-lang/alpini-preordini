<!DOCTYPE html>
<html>
<head>
    <title>Gestione Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #1f4d1f; color: white; font-family: Arial; padding: 20px; }
        label { display: block; margin: 10px 0; }
        input[type=checkbox] { transform: scale(1.5); margin-right: 10px; }
        button { padding: 10px 20px; background: #004d00; color: white; border: none; }
    </style>
</head>
<body>

<h2>🍽️ Gestione Menu</h2>

<form method="POST">
    {% for p in menu.pietanze %}
        <label>
            <input type="checkbox" name="esaurita_{{ loop.index0 }}" {% if p.esaurita %}checked{% endif %}>
            {{ p.nome }} {% if p.esaurita %}<span style="color:red;">(ESURITA)</span>{% endif %}
        </label>
    {% endfor %}

    <button type="submit">Salva</button>
</form>

</body>
</html>
