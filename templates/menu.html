<!DOCTYPE html>
<html lang="it">
<head>
    <title>Preordine Alpini</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <meta name="theme-color" content="#1f4d1f">

    <style>
        body {
            font-family: Arial;
            padding: 0;
            margin: 0;
            background: #2e6b2f;
            color: white;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        #sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 3000;
            top: 0;
            left: 0;
            background: #0f2f0f;
            overflow-x: hidden;
            transition: 0.4s;
            padding-top: 60px;
        }

        #sidebar a {
            padding: 12px 20px;
            text-decoration: none;
            font-size: 20px;
            color: white;
            display: block;
            border-bottom: 1px solid #2e6b2f;
        }

        #sidebar a:hover {
            background: #2e6b2f;
        }

        .menu-icon {
            font-size: 32px;
            cursor: pointer;
            padding: 10px;
            position: absolute;
            left: 10px;
            top: 10px;
        }

        .header {
            position: sticky;
            top: 0;
            background: #2e6b2f;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #ccc;
            z-index: 2000;
        }

        .header img {
            max-height: 60px;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: bold;
        }

        #totale-alto {
            position: fixed;
            top: 0;
            right: 0;
            margin-top: calc(10px + env(safe-area-inset-top));
            margin-right: calc(10px + env(safe-area-inset-right));
            background: #004d00;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: yellow;
            z-index: 999999;
            pointer-events: none;
        }

        .contenuto {
            padding: 20px;
            padding-bottom: 200px;
        }

        .riga {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .nome-pietanza {
            font-size: 15px;
            width: 70%;
        }

        .qta-box {
            width: 25px;
            padding: 4px;
            font-size: 16px;
            text-align: center;
        }

        .input-nome {
            width: 45%;
            padding: 6px;
            font-size: 16px;
            text-transform: uppercase;
            background: white;
            color: black;
        }

        .input-tavolo {
            width: 40px;
            padding: 4px;
            font-size: 16px;
            text-align: center;
            background: white;
            color: black;
        }

        .input-coperti {
            width: 35px;
            padding: 4px;
            font-size: 16px;
            text-align: center;
            background: white;
            color: black;
        }

        .riga-due-colonne {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .colonna {
            flex: 1;
        }

        .errore {
            border: 3px solid red !important;
            background: #ffe6e6 !important;
        }

        #pulsante-fisso {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 18px;
            background: #004d00;
            color: white;
            border: none;
            font-size: 22px;
            z-index: 3000;
            text-align: center;
        }

        #popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999999;
            backdrop-filter: blur(4px);
        }

        .popup-box {
            background: white;
            color: black;
            padding: 25px;
            width: 80%;
            max-width: 350px;
            border-radius: 14px;
            text-align: center;
            font-size: 18px;
            animation: popupFade 0.25s ease-out;
        }

        .popup-btn {
            margin-top: 18px;
            padding: 10px 20px;
            background: #2e6b2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
        }

        @keyframes popupFade {
            from { transform: scale(0.8); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
    </style>

    <script>
        function openMenu() { document.getElementById("sidebar").style.width = "250px"; }
        function closeMenu() { document.getElementById("sidebar").style.width = "0"; }

        function aggiornaTotale() {
            let totale = 0;
            let campi = document.getElementsByClassName("qta");

            for (let campo of campi) {
                let prezzo = parseFloat(campo.getAttribute("data-prezzo")) || 0;
                let qta = parseInt(campo.value) || 0;
                totale += qta * prezzo;
            }

            document.getElementById("totale-alto").innerHTML =
                "Tot: " + totale.toFixed(2) + " €";
        }

        document.addEventListener("DOMContentLoaded", function() {
            let prezzi = {{ menu | tojson }};
            for (let item of prezzi) {
                let campi = document.getElementsByName(item.nome);
                if (campi.length > 0) {
                    campi[0].setAttribute("data-prezzo", item.prezzo);
                }
            }
        });

        function limitaQta(event) {
            let v = event.target.value;
            v = v.replace(/[^0-9]/g, "");
            if (v.length > 1) v = v[0];
            if (v === "0") v = "";
            event.target.value = v;
        }

        function mostraPopup(testo) {
            document.getElementById("popup-text").innerHTML = testo;
            document.getElementById("popup").style.display = "flex";
        }

        function chiudiPopup() {
            document.getElementById("popup").style.display = "none";
        }

        function validaForm() {
            let form = document.forms[0];
            let nome = form["cliente"];
            let tavolo = form["tavolo"];
            let coperti = form["coperti"];
            let primoErrore = null;

            nome.classList.remove("errore");
            tavolo.classList.remove("errore");
            coperti.classList.remove("errore");

            if (nome.value.trim() === "") {
                nome.classList.add("errore");
                primoErrore = nome;
            }

            let tav = parseInt(tavolo.value);
            if (isNaN(tav) || tav < 1 || tav > 999) {
                tavolo.classList.add("errore");
                primoErrore = primoErrore || tavolo;
            }

            let cop = parseInt(coperti.value);
            if (isNaN(cop) || cop < 1 || cop > 99) {
                coperti.classList.add("errore");
                primoErrore = primoErrore || coperti;
            }

            let campi = document.getElementsByClassName("qta");
            let almenoUno = false;

            for (let campo of campi) {
                let qta = parseInt(campo.value);
                if (!isNaN(qta) && qta > 0) almenoUno = true;
            }

            if (!almenoUno) {
                mostraPopup("Inserisci almeno 1 piatto con quantità da 1 a 9");
                return false;
            }

            if (primoErrore) {
                primoErrore.scrollIntoView({ behavior: "smooth", block: "center" });
                mostraPopup("Controlla i campi evidenziati in rosso");
                return false;
            }

            return true;
        }

        // 🔥 Reset automatico del form quando si torna indietro
        window.onload = function() {
            if (performance.navigation.type === 2) {
                document.querySelector("form").reset();
                document.getElementById("totale-alto").innerHTML = "Tot: 0.00 €";
            }
        };
    </script>
</head>

<body>

<div id="sidebar">
    <a href="javascript:void(0)" onclick="closeMenu()">✖ Chiudi</a>
    <a href="/">🏠 Home</a>
    <a href="/menu">🍽️ Menu</a>
    <a href="/istruzioni">📘 Istruzioni</a>
    <a href="/contatti">📞 Contatti</a>
</div>

<div id="totale-alto">Tot: 0.00 €</div>

<div class="header">
    <span class="menu-icon" onclick="openMenu()">☰</span>
    <img src="https://raw.githubusercontent.com/emiliomaj60-lang/emiliodati/main/LOGO%20ALPINI.jpg">
    <h1>FESTA DEGLI ALPINI SCHILPARIO</h1>
</div>

<div class="contenuto">

    <form method="POST">

        <label>Cognome cliente:</label><br>
        <input 
            type="text"
            name="cliente"
            class="input-nome"
            inputmode="latin-name"
            autocapitalize="characters"
            autocomplete="off"
            maxlength="10"
            required
        ><br><br>

        <div class="riga-due-colonne">

            <div class="colonna">
                <label>Tavolo N°:</label><br>
                <input 
                    type="text"
                    name="tavolo"
                    class="input-tavolo"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    autocomplete="off"
                    maxlength="3"
                    required
                >
            </div>

            <div class="colonna">
                <label>Coperti:</label><br>
                <input 
                    type="text"
                    name="coperti"
                    class="input-coperti"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    autocomplete="off"
                    maxlength="2"
                    required
                >
            </div>

        </div>

        {% for item in menu %}
            <div class="riga">
                <div class="nome-pietanza">{{ item['nome'] }} ({{ item['prezzo'] }}€)</div>
                <input
                    type="text"
                    class="qta qta-box"
                    name="{{ item['nome'] }}"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="1"
                    oninput="limitaQta(event); aggiornaTotale()"
                >
            </div>
        {% endfor %}

    </form>

</div>

<button id="pulsante-fisso" onclick="
    if (validaForm()) {
        document.forms[0].submit();
    }
">Crea lista per Ordine</button>

<div id="popup">
    <div class="popup-box">
        <div id="popup-text"></div>
        <button onclick="chiudiPopup()" class="popup-btn">OK</button>
    </div>
</div>

</body>
</html>
