<!DOCTYPE html>
<html>
<head>
    <title>Accessi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #1f4d1f; color: white; font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ccc; }
        th { background: #004d00; }
    </style>
</head>
<body>

<h2>📊 Accessi all'app</h2>

<table>
    <tr><th>Data</th><th>IP</th></tr>
    {% for a in accessi %}
    <tr>
        <td>{{ a.data }}</td>
        <td>{{ a.ip }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
