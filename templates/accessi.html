<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Accessi App</title>

    <style>
        body {
            background: #1f4d1f;
            color: white;
            font-family: Arial;
            padding: 20px;
            margin: 0;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            color: black;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ccc;
            text-align: center;
            font-size: 16px;
        }

        th {
            background: #2e6b2f;
            color: white;
            font-size: 18px;
        }

        tr:hover {
            background: #f2f2f2;
        }

        .back {
            display: block;
            margin: 20px auto;
            width: 80%;
            max-width: 300px;
            padding: 10px;
            background: #004d00;
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h2>Accessi dell'app divisi per data</h2>

<table>
    <tr>
        <th>Data</th>
        <th>Accessi</th>
    </tr>

    {% for data, numero in dati.items() %}
    <tr>
        <td>{{ data }}</td>
        <td>{{ numero }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/info" class="back">⬅ Torna alle Info</a>

</body>
</html>
